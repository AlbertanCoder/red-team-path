# Once a day, open every job ad listed in jobs.js. Dead ads get hidden; live ones get today's date.
name: Check job links

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC, early morning in North America
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every ad
        run: python3 tools/check_jobs.py
      - name: Save the result
        run: |
          if git diff --quiet -- jobs.js; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.js
          git commit -m "Daily job link check"
          # If someone pushed while the check ran, put this commit on top of theirs and try once more.
          git push || (git pull --rebase && git push)
