<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Red Team Path</title>
  <meta name="description" content="A free, audited path into AI red teaming: one video series, one course, one practice site, one Python course.">
  <meta name="theme-color" content="#0B0E13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Red Team">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=20261117g">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the wrong one.
    try {
      var saved = JSON.parse(localStorage.getItem("redTeamPath.v2") || "{}").theme;
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="status">
      <div class="status-row">
        <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M148 112h216a56 56 0 0 1 56 56v124a56 56 0 0 1-56 56H238l-74 62a8 8 0 0 1-13-7l6-55h-9a56 56 0 0 1-56-56V168a56 56 0 0 1 56-56z" fill="currentColor"/>
          <circle cx="256" cy="230" r="70" fill="none" stroke="var(--accent)" stroke-width="26"/>
          <path d="M256 124v54M256 282v54M150 230h54M308 230h54" stroke="var(--accent)" stroke-width="26" stroke-linecap="round"/>
          <circle cx="256" cy="230" r="17" fill="var(--accent)"/>
        </svg>
        <span class="brand">RED TEAM PATH</span>
        <a href="#menu" id="menu-btn" data-tab="menu" data-sync="off" aria-label="Menu: syncing, settings and info">MENU</a>
      </div>
      <div class="status-row readout">
        <span class="mono" id="step-label">STEP 1 OF 4</span>
        <div class="bar" aria-hidden="true"><span id="barfill"></span></div>
        <span class="mono" id="count-label">0 OF 0 DONE</span>
      </div>
    </header>

    <main id="main">
      <p class="warning" id="storage-warning" hidden>Saving is not working in this browser (private mode, or storage is full). You can keep using the app, but ticks will be lost when you close it. Open the Menu and turn on syncing, or copy a backup code, to keep them.</p>
      <noscript><p class="warning">This app needs JavaScript turned on to show your path.</p></noscript>
      <section class="view" id="view-now" aria-label="Now"></section>
      <section class="view" id="view-path" aria-label="Path" hidden></section>
      <section class="view" id="view-words" aria-label="Words" hidden></section>
      <section class="view" id="view-jobs" aria-label="Jobs" hidden></section>
      <section class="view" id="view-menu" aria-label="Menu" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <a href="#now" data-tab="now"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Now</span></a>
      <a href="#path" data-tab="path"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/></svg><span>Path</span></a>
      <a href="#words" data-tab="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4V4z"/><path d="M9 9h5M9 13h5"/></svg><span>Words</span></a>
      <a href="#jobs" data-tab="jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Jobs</span></a>
    </nav>
  </div>
  <script src="jobs.js"></script>
  <script src="app.js?v=20261117j"></script>
</body>
</html>
