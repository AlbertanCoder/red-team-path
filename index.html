<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Red Team Path</title>
  <meta name="description" content="An audited path into AI red teaming built around Microsoft's own videos, labs and courses, free apart from one optional set of labs.">
  <meta name="theme-color" content="#0B0E13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Red Team">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=20261119h">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the wrong one.
    try {
      var saved = JSON.parse(localStorage.getItem("redTeamPath.v2") || "{}").theme;
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="top" id="top">
      <div class="top-in">
        <div class="top-text">
          <div class="tag" id="top-tag"></div>
          <h1 id="top-title" tabindex="-1"></h1>
        </div>
        <button type="button" id="path-btn" aria-haspopup="dialog">Path</button>
      </div>
    </header>

    <main id="main">
      <p class="warning" id="storage-warning" hidden>Saving is not working in this browser (private mode, or storage is full). You can keep using the app, but ticks will be lost when you close it. Tap Path, then Settings, and link a device or copy a backup code to keep them.</p>
      <noscript><p class="warning">This app needs JavaScript turned on to show your path.</p></noscript>
      <section class="view" id="view-now" aria-label="Now"></section>
      <section class="view" id="view-tutor" aria-label="Library" hidden></section>
      <section class="view" id="view-jobs" aria-label="Jobs" hidden></section>
      <section class="view" id="view-menu" aria-label="Settings" hidden></section>
    </main>

    <div class="dock" id="dock"><div class="dock-in" id="dock-in"></div></div>
  </div>
  <div class="sheet" id="sheet" role="dialog" aria-label="The whole path" hidden></div>
  <script src="jobs.js"></script>
  <script src="app.js?v=20261119h"></script>
</body>
</html>
