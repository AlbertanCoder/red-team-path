<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Red Team Path</title>
  <meta name="description" content="A free, audited path into AI red teaming: one video series, one course, one practice site, one Python course.">
  <meta name="theme-color" content="#0B0E13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Red Team">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=20261117b">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the wrong one.
    try {
      var saved = JSON.parse(localStorage.getItem("redTeamPath.v2") || "{}").theme;
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="status">
      <div class="status-row">
        <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M148 112h216a56 56 0 0 1 56 56v124a56 56 0 0 1-56 56H238l-74 62a8 8 0 0 1-13-7l6-55h-9a56 56 0 0 1-56-56V168a56 56 0 0 1 56-56z" fill="currentColor"/>
          <circle cx="256" cy="230" r="70" fill="none" stroke="var(--accent)" stroke-width="26"/>
          <path d="M256 124v54M256 282v54M150 230h54M308 230h54" stroke="var(--accent)" stroke-width="26" stroke-linecap="round"/>
          <circle cx="256" cy="230" r="17" fill="var(--accent)"/>
        </svg>
        <span class="brand">RED TEAM PATH</span>
        <span class="chip" id="streak" title="Days in a row with at least one box ticked">STREAK 0D</span>
        <button type="button" class="ghost" id="theme-btn" aria-label="Switch between dark and light">LIGHT</button>
      </div>
      <div class="status-row readout">
        <span class="mono" id="step-label">STEP 1/4</span>
        <div class="bar" aria-hidden="true"><span id="barfill"></span></div>
        <span class="mono" id="count-label">0/0</span>
      </div>
      <div class="status-row">
        <span class="mono dim" id="dial-label">TIME TODAY</span>
        <div class="dial" role="group" aria-labelledby="dial-label">
          <button type="button" data-dial="1">1 H</button>
          <button type="button" data-dial="2">2 H</button>
          <button type="button" data-dial="4">4 H</button>
        </div>
      </div>
    </header>

    <main id="main">
      <p class="warning" id="storage-warning" hidden>Saving is not working in this browser (private mode, or storage is full). You can keep using the app, but ticks will be lost when you close it. Use "Copy my progress" on the Path tab to keep a copy.</p>
      <noscript><p class="warning">This app needs JavaScript turned on to show your path.</p></noscript>
      <section class="view" id="view-next" aria-label="Next"></section>
      <section class="view" id="view-path" aria-label="Path" hidden></section>
      <section class="view" id="view-why" aria-label="Why" hidden></section>
      <section class="view" id="view-audit" aria-label="Audit" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <a href="#next" data-tab="next"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Next</span></a>
      <a href="#path" data-tab="path"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/></svg><span>Path</span></a>
      <a href="#why" data-tab="why"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8M12 17h.01"/></svg><span>Why</span></a>
      <a href="#audit" data-tab="audit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.500-7-10V6l7-3z"/><path d="M9 12l2 2 4-4.500"/></svg><span>Audit</span></a>
    </nav>
  </div>
  <script src="app.js?v=20261117b"></script>
</body>
</html>
