<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Preview 1: One road</title>
<link rel="stylesheet" href="p.css?v=1">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="shared.js?v=1"></script>
<script>
// Layout 1, "One road": the home screen IS the path, one list you scroll. Tap the lab to open its page, tap Back to return.
(function () {
  var P = window.P, el = P.el, app = document.getElementById("app");
  var screen = "home", showDone = false;
  P.banner(1, "ONE ROAD");
  function go(s) { screen = s; render(); window.scrollTo(0, 0); }
  function head(right) {
    return el("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:12px" }, [
      el("span", { class: "tag", text: "RED TEAM PATH · " + P.HOME.where }), right]);
  }
  function small(text, fn) { return el("button", { type: "button", class: "quiet", style: "width:auto;min-height:40px;padding:6px 12px", text: text, on: { click: fn } }); }
  function result() {
    if (P.st.result) {
      return el("div", { class: "stack" }, [
        el("p", { class: "note", text: P.st.result === "beat" ? "Marked: beaten." : "Marked: moved on, not solved. It goes on your come-back list." }),
        el("button", { type: "button", class: "primary", text: "Next: " + P.HOME.next + " →", on: { click: function () { alertLine.hidden = false; } } }), alertLine]);
    }
    return el("div", { class: "two" }, [
      el("button", { type: "button", class: "ok", text: "I beat it", on: { click: function () { P.st.result = "beat"; render(); } } }),
      el("button", { type: "button", text: "Moving on, not solved", on: { click: function () { P.st.result = "moved"; render(); } } })]);
  }
  var alertLine = el("p", { class: "note", hidden: "", text: "Preview only: the real app would open Episode 4 here." });
  function home() {
    app.appendChild(head(small("More", function () { go("more"); })));
    app.appendChild(small(showDone ? "Hide the 4 done" : "✓ 4 done · show", function () { showDone = !showDone; render(); }));
    if (showDone) {
      var done = el("div");
      ["Episode 1: What is AI red teaming?", "Episode 2: How generative AI models work", "Set up Microsoft's labs on your computer", "Episode 3: Direct prompt injection explained"].forEach(function (t) {
        done.appendChild(el("div", { class: "row done" }, [el("span", { class: "k", text: "done" }), el("span", { text: t })]));
      });
      app.appendChild(done);
    }
    app.appendChild(el("div", { class: "card", style: "margin-top:10px" }, [
      el("div", { class: "tag red", text: "YOU ARE HERE · LAB · " + P.HOME.level }),
      el("h1", { text: P.HOME.now }),
      el("p", { text: P.HOME.one }),
      el("button", { type: "button", class: "primary", text: "Open this lab's tutor page", on: { click: function () { go("tutor"); } } }),
      result()
    ]));
    app.appendChild(el("div", { class: "glabel", text: "Coming up" }));
    var rows = P.pathRows(false);
    // the "now" row is already the card above
    Array.prototype.forEach.call(rows.querySelectorAll(".row.now"), function (r) { r.remove(); });
    rows.removeChild(rows.firstChild);
    app.appendChild(rows);
  }
  function tutor() {
    app.appendChild(small("← Back to the path", function () { go("home"); }));
    app.appendChild(el("div", { class: "stack", style: "margin-top:10px" }, [
      el("h1", { text: P.LAB.title }), P.what(), P.objective(), P.think(), P.label(),
      P.hint(0, render), P.hint(1, render), P.hint(2, render),
      P.part("Full answer", [P.answer(render)]), P.next()]));
  }
  function render() {
    app.textContent = "";
    if (screen === "tutor") { tutor(); } else if (screen === "more") { app.appendChild(small("← Back to the path", function () { go("home"); })); app.appendChild(el("div", { style: "margin-top:10px" }, [P.moreList()])); } else { home(); }
  }
  render();
})();
</script>
</body>
</html>
